# All environment-specific values come from the environment (or files mounted at deploy time).
# Nothing in this file is a secret.
spring:
  application:
    name: zone-watch
  config:
    # deploy-time secrets as files (for example /run/zw-secrets/db_password -> property db_password)
    import: optional:configtree:${ZW_SECRETS_DIR:/run/zw-secrets}/
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ZW_DB_URL:jdbc:postgresql://localhost:5432/zonewatch}
    username: ${ZW_DB_USER:zonewatch}
    password: ${ZW_DB_PASSWORD:${db_password:}}
    hikari:
      pool-name: zw
      maximum-pool-size: ${ZW_DB_POOL_SIZE:16}
      minimum-idle: 2
      connection-timeout: 5000
      # a statement that runs this long is a bug or a lock wait; fail it instead of piling up
      data-source-properties:
        options: "-c statement_timeout=30000 -c lock_timeout=10000 -c TimeZone=UTC"
        reWriteBatchedInserts: true
  flyway:
    # Migrations run in the one-shot "migrate" container, never by the serving instances.
    enabled: ${ZW_FLYWAY_ENABLED:false}
    target: ${ZW_FLYWAY_TARGET:latest}
    locations: classpath:db/migration
  web:
    resources:
      static-locations: file:${ZW_CONSOLE_DIR:/app/console}/
      cache:
        cachecontrol:
          max-age: 0
  jackson:
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: false
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${ZW_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
    keep-alive-timeout: 20s
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      instance: ${ZW_INSTANCE:local}

logging:
  structured:
    format:
      console: ${ZW_LOG_FORMAT:logstash}
  level:
    root: INFO
    org.flywaydb: INFO

zw:
  instance: ${ZW_INSTANCE:local}
  users-file: ${ZW_USERS_FILE:}
  zones-file: ${ZW_ZONES_FILE:}
  jwt-secret: ${ZW_JWT_SECRET:}
  jwt-ttl: ${ZW_JWT_TTL:PT12H}
  max-future-skew: ${ZW_MAX_FUTURE_SKEW:PT1H}
  stream-poll-interval: ${ZW_STREAM_POLL:PT0.25S}
  mode: ${ZW_MODE:serve}
