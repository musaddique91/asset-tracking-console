# Load balancer in front of the two API instances. The instances have fixed addresses on the compose
# network (compose.yaml), resolved once when nginx starts (it starts after both are healthy), so an
# instance recreated during a rolling upgrade is reachable again the moment it listens.
# Not "resolve": re-resolving would drop a stopped instance from the pool and re-add it seconds late.
# max_fails=0: an instance is never taken out for a period. A request that cannot connect to one
# instance (stopped, restarting) is passed to the other at once (proxy_next_upstream), so while one
# instance is up no request fails. Refused connections fail fast, so the extra attempt is cheap.
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }
    log_format json escape=json '{"@timestamp":"$time_iso8601","level":"INFO","logger_name":"lb",'
        '"message":"$request_method $uri $status","requestId":"$req_id","status":$status,'
        '"upstream":"$upstream_addr","upstreamStatus":"$upstream_status","durationSec":$request_time}';
    access_log /dev/stdout json;

    upstream backends {
        zone backends 64k;
        server backend-1:8080 max_fails=0;
        server backend-2:8080 max_fails=0;
        keepalive 64;
    }

    server {
        listen 8080;
        client_max_body_size 6m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        # A request that could not be delivered to one instance (stopped, restarting) goes to the
        # other. POSTs are included: ingest is idempotent by reportId and claim is idempotent for
        # its owner, so a retry after a failed connection cannot double an effect.
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;

        location = /api/v1/stream {
            proxy_pass http://backends;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            add_header X-Served-By $upstream_addr always;
        }

        location /api/ {
            proxy_pass http://backends;
            add_header X-Served-By $upstream_addr always;
        }

        location = /health {
            proxy_pass http://backends;
            add_header X-Served-By $upstream_addr always;
        }

        # during a rolling upgrade the two instances hold different hashed asset files
        location /assets/ {
            proxy_pass http://backends;
            proxy_next_upstream error timeout http_404 http_502 http_503;
        }

        location /actuator/ {
            return 404;
        }

        location / {
            proxy_pass http://backends;
            add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; child-src blob:; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }
    }
}
